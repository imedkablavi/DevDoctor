[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "devdoctor"
version = "1.0.0"
description = "Bootstrap and repair Linux developer workstations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "DevDoctor contributors" }
]
keywords = [
  "linux",
  "cli",
  "rich",
  "developer-tools",
  "bootstrap",
  "package-manager",
  "diagnostics",
  "devops",
  "workstation",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "platformdirs>=4.2.0",
  "psutil>=7.2.2",
  "rich>=14.2.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "pytest>=8.2.0",
  "ruff>=0.6.0",
  "twine>=5.1.0",
]

[project.urls]
Homepage = "https://github.com/imedkablavi/DevDoctor"
Repository = "https://github.com/imedkablavi/DevDoctor"
Issues = "https://github.com/imedkablavi/DevDoctor/issues"
Documentation = "https://github.com/imedkablavi/DevDoctor/tree/main/docs"
Changelog = "https://github.com/imedkablavi/DevDoctor/blob/main/CHANGELOG.md"

[project.scripts]
devdoctor = "devdoctor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["devdoctor"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
