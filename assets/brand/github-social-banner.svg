  <text x="580" y="274" fill="#E5F6FF" font-family="Inter, Noto Sans, Segoe UI, sans-serif" font-size="92" font-weight="850" letter-spacing="0">DevDoctor</text>
  <text x="586" y="335" fill="#B7F7E0" font-family="Inter, Noto Sans, Segoe UI, sans-serif" font-size="31" font-weight="650">Diagnose your dev environment in seconds.</text>
