  <path d="M840 214H1184" stroke="#1E3A5F" stroke-width="2"/>
  <path d="M840 274H1050" stroke="#1E3A5F" stroke-width="2"/>
  <g filter="url(#glow)">
    <path d="M316 112L516 312L316 512L116 312L316 112Z" fill="url(#accent)"/>
    <path d="M316 176L452 312L316 448L180 312L316 176Z" fill="#08111F"/>
