      <stop offset="1" stop-color="#052E2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="184" y1="118" x2="500" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 0.4 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="48" fill="url(#background)"/>
  <path d="M0 520C250 420 460 470 650 534C832 596 1012 604 1280 480V640H0V520Z" fill="#07111F" opacity="0.8"/>
  <path d="M840 94H1160" stroke="#1E3A5F" stroke-width="2"/>
