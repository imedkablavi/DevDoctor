<svg width="640" height="160" viewBox="0 0 640 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DevDoctor logo</title>
  <desc id="desc">A diagnostic terminal diamond mark followed by the DevDoctor wordmark.</desc>
  <defs>
    <linearGradient id="markGradient" x1="20" y1="18" x2="136" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="170" y1="36" x2="540" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5F6FF"/>
      <stop offset="1" stop-color="#B7F7E0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 0.42 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="640" height="160" rx="28" fill="#0B1020"/>
  <rect x="1" y="1" width="638" height="158" rx="27" stroke="#223149" stroke-width="2"/>
  <g filter="url(#softGlow)">
    <path d="M80 18L142 80L80 142L18 80L80 18Z" fill="url(#markGradient)"/>
    <path d="M80 36L124 80L80 124L36 80L80 36Z" fill="#0B1020"/>
    <path d="M53 78H76V55H86V78H109V88H86V111H76V88H53V78Z" fill="url(#markGradient)"/>
    <path d="M48 48L64 48L64 56L48 56L48 48Z" fill="#67E8F9" opacity="0.9"/>
    <path d="M96 104L112 104L112 112L96 112L96 104Z" fill="#34D399" opacity="0.9"/>
  </g>
  <text x="172" y="87" fill="url(#wordGradient)" font-family="Inter, Noto Sans, Segoe UI, sans-serif" font-size="52" font-weight="800" letter-spacing="0">DevDoctor</text>
  <text x="176" y="118" fill="#8EA4BD" font-family="Inter, Noto Sans, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="1.6">WORKSTATION HEALTH DASHBOARD</text>
</svg>

