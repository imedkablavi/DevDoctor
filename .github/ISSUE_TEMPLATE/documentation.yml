name: Documentation request
description: Report missing, outdated, or confusing documentation.
title: "docs: "
labels: ["documentation", "needs triage"]
body:
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Link or path to the documentation.
      placeholder: "README.md, docs/CLI_REFERENCE.md, devdoctor --help"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, outdated, or unclear?
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested wording or fix
      description: Optional, but helpful.
