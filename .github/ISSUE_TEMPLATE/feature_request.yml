name: Feature request
description: Suggest a catalog entry, package manager, profile, exporter, workflow, or design improvement.
title: "feature: "
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workstation setup or repair gap should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Catalog tool
        - Package manager
        - Profile
        - Plugin
        - Exporter
        - Command UX
        - Documentation
        - Branding
        - CI/release
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: design
    attributes:
      label: Design notes
      description: Include terminal screenshots, mockups, commands, or expected output when relevant.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety expectations
      options:
        - label: The feature can run without root privileges.
          required: true
        - label: The feature previews system-changing operations before execution.
          required: true
