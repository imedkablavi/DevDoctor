name: Lazy manager probes once

on:
  push:
    branches:
      - perf/lazy-package-manager-versions
    paths:
      - .github/workflows/lazy-manager-probes-once.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v7
        with:
          ref: perf/lazy-package-manager-versions
          fetch-depth: 0

      - name: Make package-manager versions opt-in
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("devdoctor/package_managers.py")
          text = path.read_text(encoding="utf-8")
          old = 'def detect_package_managers() -> tuple[PackageManagerInfo, ...]:\n    """Detect common Linux package managers and language package managers."""'
          new = 'def detect_package_managers(\n    *, include_versions: bool = False\n) -> tuple[PackageManagerInfo, ...]:\n    """Detect package managers; version subprocesses are opt-in."""'
          if old not in text:
              raise SystemExit("package manager function signature block not found")
          text = text.replace(old, new, 1)
          old = '                version=_manager_version(path),'
          new = '                version=_manager_version(path) if include_versions else None,'
          if old not in text:
              raise SystemExit("package manager version assignment not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("devdoctor/hardening.py")
          text = path.read_text(encoding="utf-8")
          marker = 'def safe_diagnostic_snapshot() -> dict[str, Any]:'
          start = text.index(marker)
          before = text[:start]
          section = text[start:]
          old = '    managers = detect_package_managers()'
          new = '    managers = detect_package_managers(include_versions=True)'
          if old not in section:
              raise SystemExit("diagnostic manager detection call not found")
          path.write_text(before + section.replace(old, new, 1), encoding="utf-8")

          path = Path("tests/test_package_managers.py")
          text = path.read_text(encoding="utf-8")
          marker = 'def test_detect_package_managers_includes_version_and_command_hint('
          start = text.index(marker)
          before = text[:start]
          section = text[start:]
          old = '    managers = package_managers.detect_package_managers()'
          new = '    managers = package_managers.detect_package_managers(include_versions=True)'
          if old not in section:
              raise SystemExit("version probe test call not found")
          path.write_text(before + section.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format changed Python files
        run: |
          ruff format \
            devdoctor/package_managers.py \
            devdoctor/hardening.py \
            tests/test_package_managers.py \
            tests/test_package_manager_probe_budget.py

      - name: Validate lint and format
        run: |
          ruff format --check .
          ruff check .

      - name: Run targeted probe tests
        run: |
          pytest -q \
            tests/test_package_manager_probe_budget.py \
            tests/test_package_managers.py \
            tests/test_bootstrap.py \
            tests/test_hardening.py

      - name: Run full suite
        run: pytest -q

      - name: Measure RAM and latency
        run: |
          python scripts/benchmark.py \
            --iterations 5 \
            --max-startup-rss-mib 128 \
            --max-scan-rss-mib 192 \
            --output /tmp/lazy-manager-benchmark.json
          cat /tmp/lazy-manager-benchmark.json

      - name: Commit optimization and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lazy-manager-probes-once.yml
          git add \
            devdoctor/package_managers.py \
            devdoctor/hardening.py \
            tests/test_package_managers.py \
            tests/test_package_manager_probe_budget.py
          git commit -m "perf: make package-manager version probes opt-in"
          git push origin HEAD:perf/lazy-package-manager-versions
