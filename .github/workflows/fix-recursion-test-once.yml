name: Fix recursion test once

on:
  push:
    branches:
      - hardening/release-pass-2026-08
    paths:
      - .github/workflows/fix-recursion-test-once.yml

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: hardening/release-pass-2026-08
          fetch-depth: 0

      - name: Make recursion test deterministic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_project_diagnostics.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_invalid_and_excessively_nested_manifests_become_warnings(tmp_path: Path) -> None:\n    (tmp_path / "package.json").write_text("[" * 2_000 + "]" * 2_000, encoding="utf-8")\n    (tmp_path / "pyproject.toml").write_text("[project\\n", encoding="utf-8")\n\n    requirements, sources, warnings = project_diagnostics.discover_project_requirements(tmp_path)\n\n    assert requirements == ()\n    assert set(sources) == {"package.json", "pyproject.toml"}\n    assert any("package.json: invalid or excessively nested JSON" in item for item in warnings)\n    assert any("pyproject.toml: invalid or excessively nested TOML" in item for item in warnings)'''
          new = '''def test_invalid_and_excessively_nested_manifests_become_warnings(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    (tmp_path / "package.json").write_text("{}", encoding="utf-8")\n    (tmp_path / "pyproject.toml").write_text("[project\\n", encoding="utf-8")\n\n    monkeypatch.setattr(\n        project_diagnostics.json,\n        "loads",\n        lambda _text: (_ for _ in ()).throw(RecursionError("nested JSON")),\n    )\n\n    requirements, sources, warnings = project_diagnostics.discover_project_requirements(tmp_path)\n\n    assert requirements == ()\n    assert set(sources) == {"package.json", "pyproject.toml"}\n    assert any("package.json: invalid or excessively nested JSON" in item for item in warnings)\n    assert any("pyproject.toml: invalid or excessively nested TOML" in item for item in warnings)'''
          if old not in text:
              raise SystemExit("expected recursion test block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate targeted test
        run: |
          python -m pip install -e ".[dev]"
          ruff format tests/test_project_diagnostics.py
          ruff check tests/test_project_diagnostics.py
          pytest -q tests/test_project_diagnostics.py::test_invalid_and_excessively_nested_manifests_become_warnings

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-recursion-test-once.yml
          git add tests/test_project_diagnostics.py
          git commit -m "test: make JSON recursion coverage deterministic"
          git push origin HEAD:hardening/release-pass-2026-08
