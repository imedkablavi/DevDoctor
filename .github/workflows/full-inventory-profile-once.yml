name: Full inventory profile once

on:
  push:
    branches:
      - perf/full-inventory-profile
    paths:
      - .github/workflows/full-inventory-profile-once.yml

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile branch
        uses: actions/checkout@v7
        with:
          ref: perf/full-inventory-profile
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install DevDoctor
        run: python -m pip install -e ".[dev]"

      - name: Measure full default inventory
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          from statistics import mean

          import psutil

          MIB = 1024 * 1024

          def measure() -> dict[str, float]:
              started = time.perf_counter()
              process = subprocess.Popen(
                  ["devdoctor", "--quiet"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              observed = psutil.Process(process.pid)
              peak = 0
              deadline = started + 120
              while process.poll() is None:
                  if time.perf_counter() > deadline:
                      process.kill()
                      process.wait()
                      raise SystemExit("full inventory exceeded 120 seconds")
                  try:
                      rss = observed.memory_info().rss
                      for child in observed.children(recursive=True):
                          try:
                              rss += child.memory_info().rss
                          except (psutil.NoSuchProcess, psutil.AccessDenied):
                              pass
                      peak = max(peak, rss)
                  except (psutil.NoSuchProcess, psutil.AccessDenied):
                      pass
                  time.sleep(0.005)
              stderr = process.stderr.read() if process.stderr else ""
              if process.returncode != 0:
                  raise SystemExit(stderr or f"full inventory exited {process.returncode}")
              return {
                  "seconds": round(time.perf_counter() - started, 4),
                  "peak_rss_mib": round(peak / MIB, 2),
              }

          samples = [measure() for _ in range(3)]
          result = {
              "samples": samples,
              "mean_seconds": round(mean(item["seconds"] for item in samples), 4),
              "max_seconds": max(item["seconds"] for item in samples),
              "mean_peak_rss_mib": round(mean(item["peak_rss_mib"] for item in samples), 2),
              "max_peak_rss_mib": max(item["peak_rss_mib"] for item in samples),
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/full-inventory-profile-once.yml
          git commit -m "chore: remove one-shot full inventory profiler"
          git push origin HEAD:perf/full-inventory-profile
