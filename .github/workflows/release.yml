name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate format
        run: ruff format --check .

      - name: Validate lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Validate wheel install
        run: |
          python -m venv /tmp/devdoctor-release-check
          /tmp/devdoctor-release-check/bin/python -m pip install --find-links dist devdoctor-cli
          /tmp/devdoctor-release-check/bin/devdoctor --version

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: devdoctor-cli-dist
          path: dist/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
