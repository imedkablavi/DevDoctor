name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the built distributions to PyPI using trusted publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate format
        run: ruff format --check .

      - name: Validate lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Validate wheel install
        run: |
          python -m venv /tmp/devdoctor-release-check
          /tmp/devdoctor-release-check/bin/python -m pip install --no-cache-dir dist/*.whl
          /tmp/devdoctor-release-check/bin/devdoctor --version
          /tmp/devdoctor-release-check/bin/devdoctor completion bash >/dev/null
          /tmp/devdoctor-release-check/bin/devdoctor diagnostics --stdout | /tmp/devdoctor-release-check/bin/python -m json.tool >/dev/null

      - name: Add install script to release payload
        run: cp scripts/install.sh dist/devdoctor-install.sh

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: devdoctor-cli-dist
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: devdoctor-cli-dist
          path: dist

      - name: Remove non-PyPI release payloads
        run: rm -f dist/SHA256SUMS dist/devdoctor-install.sh

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
