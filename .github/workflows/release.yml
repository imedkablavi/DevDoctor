name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the built distributions to PyPI using trusted publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate format
        run: ruff format --check .

      - name: Validate lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION="$(python -c 'from devdoctor import __version__; print(__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$TAG_VERSION" = "$PACKAGE_VERSION" || {
            echo "Tag v$TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          }

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Validate wheel install
        run: |
          python -m venv /tmp/devdoctor-release-check
          /tmp/devdoctor-release-check/bin/python -m pip install --no-cache-dir dist/*.whl
          /tmp/devdoctor-release-check/bin/devdoctor --version
          /tmp/devdoctor-release-check/bin/devdoctor completion bash >/dev/null
          /tmp/devdoctor-release-check/bin/devdoctor diagnostics --stdout | /tmp/devdoctor-release-check/bin/python -m json.tool >/dev/null
          /tmp/devdoctor-release-check/bin/devdoctor self-update | grep -F devdoctor-cli

      - name: Add install script to release payload
        run: cp scripts/install.sh dist/devdoctor-install.sh

      - name: Generate SPDX SBOM
        run: python scripts/generate_sbom.py --dist dist --output dist/devdoctor.spdx.json

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
          create-storage-record: false

      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/devdoctor.spdx.json
          create-storage-record: false

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: devdoctor-cli-dist
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v7
        with:
          name: devdoctor-cli-dist
          path: dist

      - name: Remove non-PyPI release payloads
        run: rm -f dist/SHA256SUMS dist/devdoctor-install.sh dist/devdoctor.spdx.json

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
