name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Validate installer
        run: |
          sh -n scripts/install.sh
          sh scripts/install.sh --help >/dev/null

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Smoke test CLI
        run: |
          devdoctor --quiet
          devdoctor check git --quiet
          devdoctor search docker --no-color
          devdoctor repair docker --no-color
          devdoctor repair-apply docker
          devdoctor manager-conflicts
          devdoctor path-conflicts git python
          devdoctor completion bash >/tmp/devdoctor.bash
          devdoctor completion zsh >/tmp/_devdoctor
          devdoctor completion fish >/tmp/devdoctor.fish
          devdoctor diagnostics --stdout | python -m json.tool >/tmp/devdoctor-diagnostics.json
          devdoctor self-update --help >/dev/null
          devdoctor self-update | grep -F devdoctor-cli
          devdoctor uninstall --help >/dev/null
          devdoctor --json | python -m json.tool >/tmp/devdoctor-inventory.json

  clean-wheel-install:
    name: Clean wheel install / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel in isolated environment
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel into a clean virtualenv
        run: |
          python -m venv /tmp/devdoctor-clean
          /tmp/devdoctor-clean/bin/python -m pip install --no-cache-dir dist/*.whl
          /tmp/devdoctor-clean/bin/devdoctor --version
          /tmp/devdoctor-clean/bin/devdoctor completion bash >/dev/null
          /tmp/devdoctor-clean/bin/devdoctor diagnostics --stdout | /tmp/devdoctor-clean/bin/python -m json.tool >/dev/null
          /tmp/devdoctor-clean/bin/devdoctor self-update --help >/dev/null
          /tmp/devdoctor-clean/bin/devdoctor self-update | grep -F devdoctor-cli
          /tmp/devdoctor-clean/bin/devdoctor uninstall --help >/dev/null

  package-manager-fixtures:
    name: Package manager fixture matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Validate package-manager and transaction safety fixtures
        run: |
          pytest -q \
            tests/test_package_managers.py \
            tests/test_hardening.py \
            tests/test_atomic_planning.py \
            tests/test_fallback_planning.py \
            tests/test_path_conflicts.py \
            tests/test_plan_safety.py \
            tests/test_repair_transactions.py \
            tests/test_release_safety.py
